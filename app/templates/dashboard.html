<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard | Currency Exchange Tracker</title>
    <link rel="stylesheet" href="/static/css/styles.css" />
  </head>
  <body class="dashboard-body">
    <div class="dashboard-shell">
      <aside class="sidebar card">
        <div class="brand-row compact">
          <div class="brand-mark">$</div>
          <div>
            <p class="eyebrow">Market monitor</p>
            <h3>Tracker</h3>
          </div>
        </div>

        <nav class="sidebar-nav">
          <button class="nav-pill active" data-panel="overview-panel">Overview</button>
          <button class="nav-pill" data-panel="portfolio-panel">Portfolio</button>
          <button class="nav-pill" data-panel="alerts-panel">Alerts</button>
        </nav>

        <div class="mini-panel">
          <p class="label">Favorite pairs</p>
          <div id="favorite-chips" class="favorite-chips">
            <!-- filled dynamically by loadFavorites() in main.js -->
          </div>
        </div>
      </aside>

      <main class="main-panel">
        <header class="topbar card">
          <div>
            <p class="eyebrow">Live FX dashboard</p>
            <h2>Currency conversion</h2>
          </div>
          <div class="user-badge">
            <span id="user-name">Guest</span>
          </div>
        </header>

        <section id="overview-panel" class="dashboard-panel">

          <section class="converter card">
            <div class="convert-row">
              <div class="field-block">
                <label for="amount-input">Amount</label>
                <input id="amount-input" type="number" min="0" step="0.01" value="1000" maxlength="12" />
              </div>
              <div class="currency-field">
                <label for="base-currency">From</label>
                <select id="base-currency">
                  <option value="USD">USD - US Dollar</option>
                  <option value="EUR">EUR - Euro</option>
                  <option value="GBP">GBP - British Pound</option>
                  <option value="ZAR">ZAR - South African Rand</option>
                  <option value="JPY">JPY - Japanese Yen</option>
                  <option value="CHF">CHF - Swiss Franc</option>
                  <option value="AUD">AUD - Australian Dollar</option>
                  <option value="CAD">CAD - Canadian Dollar</option>
                  <option value="NZD">NZD - New Zealand Dollar</option>
                  <option value="CNY">CNY - Chinese Yuan</option>
                  <option value="INR">INR - Indian Rupee</option>
                  <option value="BRL">BRL - Brazilian Real</option>
                  <option value="MXN">MXN - Mexican Peso</option>
                  <option value="SGD">SGD - Singapore Dollar</option>
                  <option value="HKD">HKD - Hong Kong Dollar</option>
                  <option value="NOK">NOK - Norwegian Krone</option>
                  <option value="SEK">SEK - Swedish Krona</option>
                  <option value="DKK">DKK - Danish Krone</option>
                  <option value="PLN">PLN - Polish Zloty</option>
                  <option value="TRY">TRY - Turkish Lira</option>
                  <option value="AED">AED - UAE Dirham</option>
                  <option value="SAR">SAR - Saudi Riyal</option>
                  <option value="NGN">NGN - Nigerian Naira</option>
                  <option value="KES">KES - Kenyan Shilling</option>
                  <option value="EGP">EGP - Egyptian Pound</option>
                  <option value="RUB">RUB - Russian Ruble</option>
                  <option value="KRW">KRW - South Korean Won</option>
                  <option value="THB">THB - Thai Baht</option>
                </select>
              </div>
              <button id="swap-currency" class="swap-btn" aria-label="Swap currencies">⇄</button>
              <button id="favorite-toggle" class="swap-btn" aria-label="Add to favorites">☆</button>
              <div class="currency-field">
                <label for="target-currency">To</label>
                <select id="target-currency">
                  <option value="USD">USD - US Dollar</option>
                  <option value="EUR">EUR - Euro</option>
                  <option value="GBP">GBP - British Pound</option>
                  <option value="ZAR">ZAR - South African Rand</option>
                  <option value="JPY">JPY - Japanese Yen</option>
                  <option value="CHF">CHF - Swiss Franc</option>
                  <option value="AUD">AUD - Australian Dollar</option>
                  <option value="CAD">CAD - Canadian Dollar</option>
                  <option value="NZD">NZD - New Zealand Dollar</option>
                  <option value="CNY">CNY - Chinese Yuan</option>
                  <option value="INR">INR - Indian Rupee</option>
                  <option value="BRL">BRL - Brazilian Real</option>
                  <option value="MXN">MXN - Mexican Peso</option>
                  <option value="SGD">SGD - Singapore Dollar</option>
                  <option value="HKD">HKD - Hong Kong Dollar</option>
                  <option value="NOK">NOK - Norwegian Krone</option>
                  <option value="SEK">SEK - Swedish Krona</option>
                  <option value="DKK">DKK - Danish Krone</option>
                  <option value="PLN">PLN - Polish Zloty</option>
                  <option value="TRY">TRY - Turkish Lira</option>
                  <option value="AED">AED - UAE Dirham</option>
                  <option value="SAR">SAR - Saudi Riyal</option>
                  <option value="NGN">NGN - Nigerian Naira</option>
                  <option value="KES">KES - Kenyan Shilling</option>
                  <option value="EGP">EGP - Egyptian Pound</option>
                  <option value="RUB">RUB - Russian Ruble</option>
                  <option value="KRW">KRW - South Korean Won</option>
                  <option value="THB">THB - Thai Baht</option>
                </select>
              </div>
            </div>

            <div class="result-bar">
              <div>
                <span class="result-label">Live rate</span>
                <strong id="rate-badge">1 USD = 18.20 ZAR</strong>
              </div>
              <div class="status-dot-wrap">
                <span class="status-dot online"></span>
                <span id="rate-source">Live</span>
              </div>
            </div>

            <div class="output-row">
              <div>
                <p class="label">Converted amount</p>
                <h1 id="converted-output">18,200.00</h1>
              </div>
              <button id="convert-button" class="primary-btn">Convert</button>
            </div>
          </section>

          <section class="insights grid-two">
            <div class="card chart-card">
              <div class="card-header">
                <h3>Trend</h3>
                <span>7 day</span>
              </div>
              <div id="sparkline" class="sparkline" aria-label="Rate trend graph"></div>
            </div>

            <div class="card history-card">
              <div class="card-header">
                <h3>Recent history</h3>
                <button class="text-button" id="refresh-rates">Refresh</button>
              </div>
              <ul id="history-list" class="history-list">
                <li>Log in to see your conversion history.</li>
              </ul>
            </div>
          </section>

        </section>

        <section id="portfolio-panel" class="dashboard-panel card" hidden>
          <div class="card-header">
            <h3>Portfolio</h3>
          </div>
          <form id="portfolio-form" class="convert-row">
            <div class="field-block">
              <label for="portfolio-currency">Currency</label>
              <input id="portfolio-currency" maxlength="3" placeholder="USD" required />
            </div>
            <div class="field-block">
              <label for="portfolio-amount">Amount held</label>
              <input id="portfolio-amount" type="number" step="0.01" min="0" required />
            </div>
            <div class="field-block">
              <label for="portfolio-notes">Notes</label>
              <input id="portfolio-notes" placeholder="Optional" />
            </div>
            <button type="submit" class="primary-btn">Add</button>
          </form>
          <ul id="portfolio-list" class="history-list"></ul>
        </section>

        <section id="alerts-panel" class="dashboard-panel card" hidden>
          <div class="card-header">
            <h3>Alerts</h3>
          </div>
          <form id="alert-form" class="convert-row">
            <div class="currency-field">
              <label for="alert-base">From</label>
              <select id="alert-base"></select>
            </div>
            <div class="currency-field">
              <label for="alert-quote">To</label>
              <select id="alert-quote"></select>
            </div>
            <div class="field-block">
              <label for="alert-direction">Direction</label>
              <select id="alert-direction">
                <option value="above">Rises above</option>
                <option value="below">Falls below</option>
              </select>
            </div>
            <div class="field-block">
              <label for="alert-target">Target rate</label>
              <input id="alert-target" type="number" step="0.0001" min="0" required />
            </div>
            <button type="submit" class="primary-btn">Add alert</button>
          </form>
          <ul id="alerts-list" class="history-list"></ul>
        </section>

      </main>
    </div>

    <script src="/static/js/main.js"></script>
  </body>
</html>
